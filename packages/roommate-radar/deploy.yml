# roommate-radar, installed as it would be from the Steam store: what build.sh (make build) left in dist/roommate-radar. Run
# through ansible/deploy.yml (make deploy), which pairs the ssh key first.
# Valve's devkit install: dist/roommate-radar synced to ~/devkit-game/roommate_radar and added to Steam as a shortcut that runs in
# Steam Linux Runtime 4 (steamrt4-any, the tool Store apps native to Linux get). The app's own setup (driver, overlay
# manifest) happens on its first run: Steam has no install scripts on Linux (src/register.rs).
- hosts: frame
  tags: roommate-radar
  vars:
    gameid: roommate_radar # create-shortcut refuses a "-" ("missing/invalid arguments")
    dir: ~/devkit-game/{{ gameid }}
  tasks:
    # The "depot". Kept: what the app writes into its install directory (Steam leaves those alone on updates too).
    - name: Install dist/roommate-radar to ~/devkit-game/roommate_radar
      synchronize:
        src: "{{ playbook_dir }}/../../dist/roommate-radar/"
        dest: "{{ dir }}/"
        delete: true
        rsync_opts: [--exclude=/roommate-radar.vrmanifest]

    # What the devkit client's upload writes: the command line, and the runtime Steam should run it in
    - name: Set the launch command and runtime
      copy:
        dest: ~/devkit-game/{{ gameid }}-{{ item.key }}.json
        content: "{{ item.value | to_json }}"
      loop: "{{ {'argv': ['./bin/roommate-radar'], 'settings': {'compat_tool': 'steamrt4-any'}} | dict2items }}"

    # devkit-utils/steam-client-create-shortcut: a devkit-1 command on Steam's pipe; Steam answers in a file
    - name: Add it to Steam (devkit shortcut)
      shell: |
        d=$(mktemp -d /tmp/create-shortcutXXXXXXXX)
        r=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote_plus(sys.argv[1]))' "$d/registered")
        printf 'devkit-1 steam://devkit-1/%s/create-shortcut?response=%s&gameid={{ gameid }}\n' "$(cat ~/.steam/steam.token)" "$r" > ~/.steam/steam.pipe
        for i in $(seq 15); do
          sleep 1
          if [ -e "$d/registered.error" ]; then cat "$d/registered.error"; exit 1; fi
          if [ -e "$d/registered" ] && [ ! -e "$d/registered.lock" ]; then cat "$d/registered"; rm -r "$d"; exit 0; fi
        done
        echo "Steam didn't answer (is it running?)"; exit 1
      changed_when: false
