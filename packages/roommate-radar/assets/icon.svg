<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Roommate Radar: a forward radar fan from you (white, at the bottom), a person (red) and a pet (amber) in it.
       The dashboard tab's icon is assets/icon-128.rgba, rasterized from this (see panel.rs). -->
  <defs>
    <!-- glow around each dot: a quarter opacity out to its radius, fading to nothing at 3x -->
    <radialGradient id="red"><stop offset="0.333" stop-color="#ff453a" stop-opacity="0.25"/><stop offset="1" stop-color="#ff453a" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber"><stop offset="0.333" stop-color="#ffb800" stop-opacity="0.25"/><stop offset="1" stop-color="#ffb800" stop-opacity="0"/></radialGradient>
    <radialGradient id="white"><stop offset="0.333" stop-color="#f5f5f7" stop-opacity="0.25"/><stop offset="1" stop-color="#f5f5f7" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="#141418"/>
  <g fill="none" stroke="#ff453a">
    <!-- fan: apex (64, 106), radius 80, 45 degrees either side of straight ahead -->
    <path d="M64 106 L7.43 49.43 A80 80 0 0 1 120.57 49.43 Z" fill="#ff453a" fill-opacity="0.12" stroke="none"/>
    <path d="M42.79 84.79 A30 30 0 0 1 85.21 84.79 M22.28 64.28 A59 59 0 0 1 105.72 64.28 M7.43 49.43 A80 80 0 0 1 120.57 49.43"
          stroke-width="2" stroke-opacity="0.5"/>
    <path d="M7.43 49.43 L64 106 L120.57 49.43" stroke-width="2.5" stroke-opacity="0.75" stroke-linejoin="round"/>
  </g>
  <circle cx="51.87" cy="63.7" r="19.5" fill="url(#red)"/>
  <circle cx="51.87" cy="63.7" r="6.5" fill="#ff453a"/>
  <circle cx="92.06" cy="48.48" r="15" fill="url(#amber)"/>
  <circle cx="92.06" cy="48.48" r="5" fill="#ffb800"/>
  <circle cx="64" cy="106" r="15" fill="url(#white)"/>
  <circle cx="64" cy="106" r="5" fill="#f5f5f7"/>
</svg>
