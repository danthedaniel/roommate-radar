[package]
name = "roommate-radar"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

# The SteamVR driver (src/driver/), loaded into the host's vrserver
[lib]
name = "driver_roommate_radar"
path = "src/driver/lib.rs"
crate-type = ["cdylib"]

# The overlay app
[[bin]]
name = "roommate-radar"
path = "src/main.rs"

# Developer builds (make deploy): YOLO time in the tab's status, confidence on the labels
[features]
developer = []

[dependencies]
ash = "0.38"
fontdue = "0.9"
libc = "0.2"
serde_json = "1"
