# Configure the Frame: cd ansible && ansible-playbook deploy.yml [--tags mirror|roommate-radar] (or make deploy-all|deploy-mirror|deploy)
# From a fresh Frame this does all the setup; only Developer Mode (Settings -> System) has to be switched on by hand.
# roommate-radar installs what build.sh (make build) left in dist/roommate-radar.
- import_playbook: pair.yml
- import_playbook: ../packages/mirror/deploy.yml
- import_playbook: ../packages/roommate-radar/deploy.yml
